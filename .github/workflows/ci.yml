name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # fy-docs passes `--pdf-standard 2.0` (Typst 0.14+) and is developed
  # against Typst 0.15; pin so "tested against" is actually enforced.
  TYPST_VERSION: "0.15.1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Install Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Verify package
        run: cargo package

      - name: Verify vendored template in sync
        run: cargo run -q -- vendor --check

      - name: Compile dogfood documentation
        run: cargo run -q -- html

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Run tests
        run: cargo test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: lcov.info
